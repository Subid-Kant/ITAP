# ITAP v2.0 — pytest configuration
#
# Before this file existed the backend had no pytest configuration at all:
#   * `@pytest.mark.asyncio` was used by test_telemetry_concurrency.py but
#     pytest-asyncio was in strict mode by default, so async tests were
#     reported as errors/skips depending on the installed version.
#   * Recursion into backend/venv made collection take minutes.
#   * There was no timeout, so any blocked OSINT/Ollama socket hung CI forever.

[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Never collect the virtualenv, caches, or generated ML artefacts.
norecursedirs =
    venv
    .venv
    .git
    .pytest_cache
    __pycache__
    build
    dist
    node_modules
    checkpoints
    weights
    data

# Run plain `async def test_...` functions without needing an explicit marker.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Cap every test so a hung network call surfaces as a failure instead of a
# never-ending CI job. timeout_method=thread works even when the hang happens
# inside blocking C/library code.
timeout = 120
timeout_method = thread

addopts = -ra --strict-markers --strict-config

markers =
    live: allows real outbound network calls (opt in explicitly, off by default)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
